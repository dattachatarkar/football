<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Store</title>
<!-- Microsoft Clarity -->
<script type="text/javascript">

t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
})(window, document, "clarity", "script", "vuyzshquim");
</script>
<style>
body{
  font-family: Arial;
  margin:0;
  background:#f4f4f4;
}
header{
  background:#111;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:24px;
  font-weight:bold;
}
.cart{
  background:#ff6600;
  padding:8px 14px;
  border-radius:5px;
  cursor:pointer;
  position:relative;
}
.hero{
  background:url("https://images.unsplash.com/photo-1508098682722-e99c43a406b2") center/cover;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:40px;
  font-weight:bold;
  text-shadow:0 2px 8px rgba(0,0,0,0.6);
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:30px;
}
.card{
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 5px 10px rgba(0,0,0,0.1);
  text-align:center;
  transition:transform 0.2s;
}
.card:hover{
  transform:translateY(-4px);
}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:8px;
}
.price{
  color:green;
  font-size:18px;
  margin:10px 0;
}
button{
  background:#111;
  color:white;
  border:none;
  padding:10px 15px;
  cursor:pointer;
  border-radius:5px;
  font-size:14px;
  transition:background 0.2s;
}
button:hover{
  background:#ff6600;
}
.toast{
  position:fixed;
  bottom:30px;
  right:30px;
  background:#111;
  color:white;
  padding:12px 20px;
  border-radius:8px;
  font-size:14px;
  opacity:0;
  transition:opacity 0.3s;
  pointer-events:none;
  z-index:999;
}
.toast.show{
  opacity:1;
}
footer{
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:30px;
}
</style>
</head>
<body>
<header>
  <div class="logo">⚽ Football Store</div>
  <div class="cart">Cart: <span id="cart-count">0</span></div>
</header>
<div class="hero">
  Best Football Equipment
</div>
<section class="products">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1579952363873-27d3bfad9c0d" alt="Professional Football">
    <h3>Professional Football</h3>
    <p class="price">$30</p>
    <button onclick="addToCart('Professional Football')">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1511886929837-354d827aae26" alt="Football Boots">
    <h3>Football Boots</h3>
    <p class="price">$75</p>
    <button onclick="addToCart('Football Boots')">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb" alt="Goalkeeper Gloves">
    <h3>Goalkeeper Gloves</h3>
    <p class="price">$40</p>
    <button onclick="addToCart('Goalkeeper Gloves')">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1599058917212-d750089bc07e" alt="Shin Guards">
    <h3>Shin Guards</h3>
    <p class="price">$20</p>
    <button onclick="addToCart('Shin Guards')">Add to Cart</button>
  </div>
</section>
<div class="toast" id="toast"></div>
<footer>
  © 2026 Football Store
</footer>
<script>
let cart = 0;
function addToCart(name){
  cart++;
  document.getElementById("cart-count").innerText = cart;
  showToast(name + " added to cart!");
}
function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}
</script>
</body>
</html>
